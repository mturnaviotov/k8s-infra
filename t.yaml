apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-backend-policy
  namespace: todo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: todo
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: todo-frontend
          app: todo-frontend
    - ipBlock:
        cidr: 10.0.0.0/8
    ports:
    - protocol: TCP
      port: 8080
  egress: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-frontend-policy
  namespace: todo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: todo-frontend
      app: todo-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {}
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: backend
          app.kubernetes.io/instance: todo
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns # Або інша мітка вашого DNS
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: todo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
