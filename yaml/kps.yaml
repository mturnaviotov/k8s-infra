## default KPS values https://github.com/prometheus-community/helm-charts/raw/refs/heads/main/charts/kube-prometheus-stack/values.yaml

# Default values for kube-prometheus-stack.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## Create default rules for monitoring the cluster
##
defaultRules:
  create: true

##
global:
  rbac:
    create: true

## Configuration for alertmanager
## ref: https://prometheus.io/docs/alerting/alertmanager/
##
alertmanager:
  enabled: true

grafana:
  enabled: true
  envFromSecret: oauth-grafana

  grafana.ini:
    server:
      root_url: https://grafana.${zone_name}
      domain: grafana.${zone_name}

    auth:
      disable_login_form: false
      disable_signout_menu: false

    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: "${clientID}"
      client_secret: "$${OAUTH_CLIENT_SECRET}"
      scopes: openid profile email roles

      auth_url: ${issuer}/protocol/openid-connect/auth
      token_url: ${issuer}/protocol/openid-connect/token
      api_url: ${issuer}/protocol/openid-connect/userinfo
      login_attribute_path: preferred_username
%{ for group in admin_groups ~}
      role_attribute_path: "contains(resource_access.grafana.roles[*], ${group} ) && 'Admin' || 'Viewer'"
      role_attribute_path: "contains(groups[*], '${group}' ) && 'Admin' || 'Viewer'"
%{ endfor ~}
#### GRAFANA.INI FINISH
  additionalDataSources:
  - name: Loki
    type: loki
    access: proxy
    url: https://loki.${zone_name}
    uid: loki
## Deploy node exporter as a daemonset to all nodes
##
nodeExporter:
  enabled: true
  operatingSystems:
    linux:
      enabled: false
    aix:
      enabled: true
    darwin:
      enabled: true

prometheusOperator:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    ## enable --web.enable-remote-write-receiver flag on prometheus-server
    enableRemoteWriteReceiver: true
    retention: 2d
    logLevel: info
    logFormat: json
    ## Enable/Disable Grafana dashboards provisioning for prometheus remote write feature
    remoteWriteDashboards: true
  ## Configuration for thanosRuler
  ## ref: https://thanos.io/tip/components/rule.md/
  ##
thanosRuler:
  enabled: false
