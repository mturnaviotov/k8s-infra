# source of true https://raw.githubusercontent.com/grafana/alloy/main/operations/helm/charts/alloy/values.yaml
# helm install -n mon alloy grafana/alloy -f ./yaml/alloy-tune.yaml
# ./yaml/alloy-tune.yaml
###
alloy:
  mounts:
    varlog: true
    containerspath: /var/log/pods

  config:
    table_manager:
      retention_deletes_enabled: true

    limits_config:
      ingestion_rate_mb: 4
      max_streams_per_tenant: 0

  configMap:
    content: |
      logging {
        level  = "info"
        format = "json"
      }

      livedebugging {
        enabled = true
      }

      loki.write "loki" {
        endpoint {
          url       = "${loki_url}/loki/api/v1/push" 
          tenant_id = "local"
        }
      }

      local.file_match "logs" {
        path_targets = [{
            // Monitor syslog to scrape node-logs
            __path__  = "/var/log/pods/*",
            //job       = "node/syslog",
            //node_name = sys.env("HOSTNAME"),
            //cluster   = orbstack,
        }]
      }

      loki.source.file "logs" {
        // Collect logs from the default listen address.
        // local.file_match.logs.targets
        targets = [
          {__path__ = "/var/log/pods", "color" = "pink"},
        ]

        forward_to = [loki.write.loki.receiver]
      }

      discovery.kubernetes "pod" {
        role = "pod"
        // Restrict to pods on the node to reduce cpu & memory usage
        selectors {
          role = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      // discovery.relabel rewrites the label set of the input targets by applying one or more relabeling rules.
      // If no rules are defined, then the input targets are exported as-is.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets

        // Label creation - "namespace" field from "__meta_kubernetes_namespace"
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action = "replace"
          target_label = "namespace"
        }

        // Label creation - "pod" field from "__meta_kubernetes_pod_name"
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          target_label = "pod"
        }

        // Label creation - "container" field from "__meta_kubernetes_pod_container_name"
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "container"
        }

        // Label creation -  "app" field from "__meta_kubernetes_pod_label_app_kubernetes_io_name"
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action = "replace"
          target_label = "app"
        }

        // Label creation -  "job" field from "__meta_kubernetes_namespace" and "__meta_kubernetes_pod_container_name"
        // Concatenate values __meta_kubernetes_namespace/__meta_kubernetes_pod_container_name
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "job"
          separator = "/"
          replacement = "$1"
        }

        // Label creation - "__path__" field from "__meta_kubernetes_pod_uid" and "__meta_kubernetes_pod_container_name"
        // Concatenate values __meta_kubernetes_pod_uid/__meta_kubernetes_pod_container_name.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "__path__"
          separator = "/"
          replacement = "/var/log/pods/*$1/*.log"
        }

        // Label creation -  "container_runtime" field from "__meta_kubernetes_pod_container_id"
        rule {
          source_labels = ["__meta_kubernetes_pod_container_id"]
          action = "replace"
          target_label = "container_runtime"
          regex = "^(\\S+):\\/\\/.+$"
          replacement = "$1"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        forward_to = [loki.write.loki.receiver]
        stage.static_labels {
          values = {
            cluster = "orbstack",
          }
        }
      }

      // PowerDNS
      prometheus.scrape "powerdns" {
        targets = [{"__address__" = "pdns.dns.svc.cluster.local:8081","__metrics_path__" = "/metrics"}]
        http_headers = {"X-API-KEY" = [ "123123123" ]}
        basic_auth {
          username = "admin"
          password = "123123123"
        }

        scrape_interval = "15s"
        forward_to = [prometheus.remote_write.prom.receiver]
      }

      // Jenkins
      prometheus.scrape "jenkins" {
        scheme = "https"
        targets = [{"__address__" = "jenkins.zone.internal","__metrics_path__" = "/prometheus/"}]
        tls_config {
          insecure_skip_verify = true 
        }
        scrape_interval = "15s"
        forward_to = [prometheus.remote_write.prom.receiver]
      }

      prometheus.remote_write "prom" {
        endpoint {
          url = "http://kps-kube-prometheus-stack-prometheus.mon.svc.cluster.local:9090/api/v1/write"
          tls_config { insecure_skip_verify = true }
        }
      }
