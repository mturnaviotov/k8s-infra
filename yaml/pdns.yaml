apiPassword: "${password}"
image:
  pullPolicy: IfNotPresent
  repository: powerdns/pdns-auth-master
ingress:
  type: LoadBalancer
  IP: 192.168.194.10
  annotations:
    cert-manager.io/cluster-issuer: local-ca
    external-dns.alpha.kubernetes.io/hostname: "pdns.${zone_name}"
    kubernetes.io/ingress.className: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    metallb.io/address-pool: dns-pool
    metallb.io/loadBalancerIPs: "192.168.194.10"
  enabled: true
  host: "pdns.${zone_name}"
  port: 8081
pdns:
  args:
  - --api=yes
  - --api-key=$(PDNS_API_KEY)
  - --webserver=yes
  - --webserver-address=0.0.0.0
  - --webserver-allow-from=192.168.0.0/16,127.0.0.1,::1
  - --webserver-password=$(PDNS_API_KEY)
  - --disable-syslog=yes
  - --webserver-loglevel=detailed
  resources:
    limits:
      cpu: 200m
      memory: 512M
    requests:
      cpu: 100m
      memory: 256M
  zones:
  - ${zone_name}
service:
  annotations: null
  dnstcp:
    enabled: true
    port: 53
    protocol: TCP
  dnsudp:
    enabled: true
    port: 53
    protocol: UDP
  type: ClusterIP
  webserver:
    enabled: true
    port: 8081
    protocol: TCP
spec:
  ingressClassName: traefik
  rules:
  - host: "pdns.${zone_name}"
    http:
      paths:
      - backend:
          service:
            name: "pdns.${zone_name}"
            port:
              number: 8081
        path: /
        pathType: Prefix
