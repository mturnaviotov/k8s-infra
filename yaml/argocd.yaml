##
## source of truth: https://raw.githubusercontent.com/argoproj/argo-helm/refs/heads/main/charts/argo-cd/values.yaml
##

global:
  domain: ${argo_url}

server:
  replicas: 1
  ingress:
    enabled: false
  insecure: true
  service:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: ip-pool

configs:
  cm:
    create: true
    admin.enabled: true
    application.instanceLabelKey: argocd.argoproj.io/instance
    oidc.tls.insecure.skip.verify: "true"
    oidc.config: |
      name: Keycloak
      issuer: ${issuer}
      clientID: "${clientID}"
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email"]
    url: https://${argo_url}

  params:
    server.insecure: "true"
    applicationsetcontroller.enable.leader.election: "false"
    applicationsetcontroller.log.format: json
    applicationsetcontroller.log.level: info
    applicationcontroller.log.format: json
    applicationcontroller.log.level: info
    commitserver.log.format: json
    commitserver.log.level: info
    controller.log.format: json
    controller.log.level: info
    dexserver.log.format: json
    dexserver.log.level: info
    notificationscontroller.log.format: json
    notificationscontroller.log.level: info
    redis.server: argocd-redis:6379
    repo.server: argocd-repo-server:8081
    reposerver.log.format: json
    reposerver.log.level: info
    server.log.format: json
    server.log.level: info
    server.repo.server.strict.tls: "false"
  rbac:
    policy.csv: |
      %{ for group in admin_groups ~}
      g, ${group}, role:admin
      %{ endfor ~}

    policy.default: ""
    policy.matchMode: glob
    scopes: "[groups]"

  secret:
    create: true
    extra:
      oidc.keycloak.clientSecret: "${oidc_client_secret}"

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

dex:
  enabled: false
