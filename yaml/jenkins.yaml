persistence:
  enabled: true
  size: "128Mi"

controller:
  admin:
    password: "${admin_password}"

  serviceType: LoadBalancer
  annotations:
    metallb.io/address-pool: ip-pool

  installPlugins:
    - kubernetes
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.0
    - configuration-as-code:2053.vb_0da_47381a_25
    - oic-auth:4.626.ve5a_d9f26c051
    - role-strategy

  JCasC:
    defaultConfig: false
    configScripts:
      data: |
        credentials:
          system:
            domainCredentials:
            - credentials:
              - usernamePassword:
                  description: "my docker hub account"
                  id: "dockerhub"
                  password: "${dockerhub_password}"
                  scope: GLOBAL
                  username: "${dockerhub_login}"
              - usernamePassword:
                  description: "my github pat account"
                  id: "github_pat"
                  password: "${github_pat}"
                  scope: GLOBAL
                  username: "{github_account}"

        jenkins:
          authorizationStrategy:
            roleBased:
              roles:
                global:
                - entries:
                  - group: "authenticated"
                  name: "admin"
                  pattern: ".*"
                  permissions:
                  - "Overall/Administer"
                - entries:
                  - user: "user-admin"
                  - group: "authenticated"
                  - group: "jenkins-admin"
                  name: "jenkins_admin"
                  pattern: ".*"
                  permissions:
                  - "Overall/Administer"          
            # globalMatrix:
            #   entries:
            #   - group:
            #       name: "admin"
            #       permissions:
            #       - "Overall/Administer"
            #   - group:
            #       name: "authenticated"
            #       permissions:
            #       - "Overall/Read"
            #       - "Overall/Administer"  
            #   - group:
            #       name: "${jenkins_admin_group}"
            #       permissions:
            #       - "Overall/Administer"
          clouds:
          - kubernetes:
              containerCap: 10
              containerCapStr: "10"
              jenkinsTunnel: "jenkins-agent.${kubernetes_namespace}.${dns_zone}:50000"
              jenkinsUrl: "http://${jenkins_full_url}:8080"
              name: "kubernetes"
              namespace: "${kubernetes_namespace}"
              podLabels:
              - key: "jenkins/jenkins-jenkins-agent"
                value: "true"
              serverUrl: "https://kubernetes.default"
              templates:
              - containers:
                - args: "^$${computer.jnlpmac} ^$${computer.name}"
                  envVars:
                  - envVar:
                      key: "JENKINS_URL"
                      value: "http://${jenkins_full_url}:8080/"
                  image: "jenkins/inbound-agent:3345.v03dee9b_f88fc-5"
                  name: "jnlp"
                  resourceLimitCpu: "512m"
                  resourceLimitMemory: "512Mi"
                  resourceRequestCpu: "512m"
                  resourceRequestMemory: "512Mi"
                  workingDir: "/home/jenkins/agent"
                id: "f60e51047648982e11c2ad5e7d6e2b363e709301fbf1ac2900f37a600a87528a"
                label: "jenkins-jenkins-agent"
                name: "default"
                namespace: "${kubernetes_namespace}"
                nodeUsageMode: "NORMAL"
                podRetention: "never"
                serviceAccount: "default"
                slaveConnectTimeout: 100
                slaveConnectTimeoutStr: "100"
                yamlMergeStrategy: "override"
          crumbIssuer:
            standard:
              excludeClientIPFromCrumb: true
          disableRememberMe: false
          disabledAdministrativeMonitors:
          - "hudson.util.DoubleLaunchChecker"
          - "hudson.diagnosis.ReverseProxySetupMonitor"
          labelAtoms:
          - name: "built-in"
          - name: "jenkins-jenkins-agent"
          log: {}
          markupFormatter: "plainText"
          mode: NORMAL
          nodeMonitors:
          - "architecture"
          - "clock"
          - diskSpace:
              freeSpaceThreshold: "1GiB"
              freeSpaceWarningThreshold: "2GiB"
          - "swapSpace"
          - tmpSpace:
              freeSpaceThreshold: "1GiB"
              freeSpaceWarningThreshold: "2GiB"
          - "responseTime"
          numExecutors: 0
          primaryView:
            all:
              name: "all"
          projectNamingStrategy: "standard"
          quietPeriod: 5
          remotingSecurity:
            enabled: true
          scmCheckoutRetryCount: 0
          securityRealm:
            oic:
              clientId: "${oidc_clientid}"
              clientSecret: "${oidc_secret}"
              disableSslVerification: true
              emailFieldName: "email"
              fullNameFieldName: "firstName LastName"
              groupIdStrategy: "caseInsensitive"
              logoutFromOpenidProvider: false
              serverConfiguration:
                wellKnown:
                  scopesOverride: "openid email profile"
                  wellKnownOpenIDConfigurationUrl: "https://${oidc_issuer}/.well-known/openid-configuration"
              userIdStrategy: "caseInsensitive"
              userNameField: "preferred_username"
              groupsFieldName: "groups"
          slaveAgentPort: 50000
          updateCenter:
            sites:
            - id: "default"
              url: "https://updates.jenkins.io/update-center.json"
          views:
          - all:
              name: "all"
          viewsTabBar: "standard"
        globalCredentialsConfiguration:
          configuration:
            providerFilter: "none"
            typeFilter: "none"
        appearance:
          consoleUrlProvider: {}
          prism:
            theme: PRISM
        security:
          apiToken:
            creationOfLegacyTokenEnabled: false
            tokenGenerationOnCreationEnabled: false
            usageStatisticsEnabled: true
          cps:
            hideSandbox: false
          crumb: {}
          gitHostKeyVerificationConfiguration:
            sshHostKeyVerificationStrategy: "knownHostsFileVerificationStrategy"
          prism: {}
          queueItemAuthenticator: {}
          #sSHD:
          #  port: -1
          scriptApproval:
            forceSandbox: false
          updateSiteWarningsConfiguration: {}
        unclassified:
          administrativeMonitorsConfiguration: {}
          artifactManager: {}
          buildDiscarders:
            configuredBuildDiscarders:
            - "jobBuildDiscarder"
          # builtInNode: {} 5.8.3 and upper fails
          casCGlobalConfig: {}
          computerRetentionCheckInterval: {}
          defaultDisplayUrlProvider: {}
          defaultFolderConfiguration: {}
          defaultView: {}
          envVarsFilter: {}
          fingerprints:
            fingerprintCleanupDisabled: false
            storage: "file"
          globalDefaultFlowDurabilityLevel: {}
          globalLibraries: {}
          globalUntrustedLibraries: {}
          #junitTestResultStorage:
          #  storage: "file"
          location:
            adminAddress: "${admin_email}"
            url: "https://${jenkins_url}/"
          mailer:
            charset: "UTF-8"
            useSsl: false
            useTls: false
          metricsAccessKey: {}
          myView: {}
          nodeProperties: {}
          plugin: {}
          pollSCM:
            pollingThreadCount: 10
          projectNamingStrategy: {}
          proxyConfigurationManager: {}
          quietPeriod: {}
          resourceRoot: {}
          scmRetryCount: {}
          shell: {}
          usageStatistics: {}
          viewsTabBar: {}
        tool:
          git:
            installations:
            - home: "git"
              name: "Default"
          mavenGlobalConfig:
            globalSettingsProvider: "standard"
            settingsProvider: "standard"
