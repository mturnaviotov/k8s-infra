# source of truth https://github.com/hashicorp/vault-helm/blob/main/values.yaml
# vault-values.yaml
dataStorage:
  enabled: true
  # Size of the PVC created
  size: 128Mi

server:
  dev:
    enabled: true
    devRootToken: admin12345
    # $ {admin_token}

  ingress:
    enabled: true
    activeService: true
    hosts:
      - host: vault.zone.internal
        # $ {server}
        paths: []
    annotations:
      cert-manager.io/cluster-issuer: local-ca
      external-dns.alpha.kubernetes.io/hostname: vault.zone.internal
      # $ {server}
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      metallb.io/address-pool: ip-pool

    ingressClassName: traefik
    rules:
      - host: vault.zone.internal
        # $ {server}
        http:
          paths:
            - backend:
                service:
                  name: vault-server
                  port:
                    number: 80
              path: /
              pathType: Prefix
    tls:
      - hosts:
          - vault.zone.internal
        # $ {server}
        secretName: vault-tls

config: telemetry { prometheus_retention_time = "30s" disable_hostname = false }

injector:
  enabled: true

serviceAccount:
  create: true
  name: vault
