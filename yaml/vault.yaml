# source of truth https://github.com/hashicorp/vault-helm/blob/main/values.yaml
# vault-values.yaml

server:
  dev:
    enabled: true
    devRootToken: ${admin_token}

  ingress:
    enabled: true
    activeService: true
    hosts:
    - host: ${server}
      paths: []
    annotations:
      cert-manager.io/cluster-issuer: local-ca
      external-dns.alpha.kubernetes.io/hostname: ${server}
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    ingressClassName: traefik
    rules:
    - host: ${server}
      http:
        paths:
        - backend:
            service:
              name: vault-server
              port:
                number: 80
          path: /
          pathType: Prefix
    tls:
    - hosts:
      - ${server}
      secretName: vault-tls

config: telemetry { prometheus_retention_time = "30s" disable_hostname = false }

injector:
  enabled: true

serviceAccount:
  create: true
  name: vault
