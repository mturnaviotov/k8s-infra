loki:
  schemaConfig:
    configs:
    - from: 2024-04-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  ingester:
    chunk_encoding: snappy
  tracing:
    enabled: true
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 4

gateway:
ingress:
  enabled: true
  hosts:
  - host: "${host}"
    paths:
    - path: /
      pathType: Prefix

deploymentMode: singleBinary

singleBinary:
  replicas: 1
